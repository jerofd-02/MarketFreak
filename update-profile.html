<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar perfil</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/form_style_page.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
<header id="header"></header>

<main>
    <div class="form_container">
        <form class="form_group" action="#" method="POST">
            <label for="avatar">Lorem Ipsum</label>
            <div class="add-photo" id="file_charge">
                <i></i>
                <p>Lorem ipsum dolor sit amet</p>
                <input id="avatar" type="file" accept="image/*">
                <div class="avatar-preview"></div>
            </div>
            <div class="element">
                <label for="username">Lorem Ipsum</label>
                <input id="username" type="text" placeholder="Lorem ipsum dolor sit amet..." required>
            </div>
            <div class="element">
                <label for="location">Lorem Ipsum</label>
                <input id="location" type="text" placeholder="Lorem ipsum dolor sit amet..." required>
            </div>
            <div class="element">
                <label for="province">Lorem Ipsum</label>
                <select id="province" required>
                    <option value="Lorem Ipsum">Lorem ipsum dolor sit amet...</option>
                </select>
            </div>
            <div class="element">
                <label for="description">Lorem Ipsum</label>
                <textarea id="description" placeholder="Lorem ipsum dolor sit amet..."></textarea>
            </div>
            <button type="submit" class="button">Lorem Ipsum</button>
        </form>
    </div>
</main>

<footer id="footer"></footer>

<script src="js/common.js"></script>
<script src="js/update-profile.js"></script>
</body>
</html>
