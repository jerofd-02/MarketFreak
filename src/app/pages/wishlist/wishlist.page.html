<app-page-layout>
  <div class="container-fluid px-3 px-md-4 py-4">

    <div class="d-flex flex-column gap-2 mb-4">

      <div class="position-relative d-inline-flex align-items-center">
        <i class="bi bi-search position-absolute ms-2" style="color: var(--crimson); pointer-events:none;"></i>
        <input type="text"
               class="form-control ps-4 wish-input"
               [placeholder]="searchPlaceholder"
               (input)="onSearch($any($event.target).value)">
      </div>

      <div>
        <select class="wish-select rounded-3 border-0 fw-bold"
                id="opciones" name="opciones"
                (change)="onSortChange($any($event.target).value)">
          @for (option of sortOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>

    </div>

    <div>
      @if (filteredProducts.length > 0) {
        <app-photo-row [products]="filteredProducts" />
      } @else {
        <p class="text-muted fst-italic text-center">Tu wishlist está un poco vacía...</p>
      }
    </div>

  </div>
</app-page-layout>
