<div class="row border-5 pb-0 mx-0 carousel-divider">
  <div class="col-12 col-md d-flex justify-content-center align-items-start p-2">
    <img [src]="user?.photo || 'assets/images/misc/placeholder_image.png'" alt="user?.name || ''"
         class="profile-img rounded-circle">
  </div>

  <div class="col-12 col-md-6 p-2 d-flex flex-column">
    @if (user) {
      @if (user) {
        <div class="product-info">
          <h1 class="product-name">{{ user.name }}</h1>
          <p class="product-seller">{{ user.seller }}</p>
          <p class="product-location">{{ user.location }}</p>
          <p id="description" class="product-description">{{ user.description }}</p>
        </div>
      }
    }
    @if (isOwner) {
      <a [routerLink]="profileData?.editButton?.routerLink"
         class="profile-button edit-profile-button text-center">{{ profileData?.editButton?.label }}</a>
    }
  </div>
</div>

@if (profileData) {
  <h1 class="px-3 mt-3" id="products_title">{{ profileData.productsTitle }}</h1>
}

<app-photo-row [products]="products" [addProductButton]="isOwner ? (profileData?.addProductButton ?? null) : null"/>
