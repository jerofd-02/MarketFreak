<app-page-layout>
  @if (product) {
    <div class="container-fluid px-3 px-md-4 py-4">

      <div class="d-flex flex-column flex-md-row gap-3 gap-md-4 pb-4 border-bottom border-burgundy">

        <div class="carousel-wrapper flex-shrink-0">
          <app-carousel [carousel]="carousel"></app-carousel>
        </div>

        <div class="d-flex flex-column w-100">

          <div class="d-flex align-items-center gap-2 mt-2 mb-3">
            @if (user) {
              <img [src]="user.photo" [alt]="user.name"
                   class="rounded-circle object-fit-cover"
                   style="width:45px; height:45px;">
              <a [routerLink]="['/profile']" [queryParams]="{seller: product.seller}"
                 class="text-dark fw-bold text-decoration-none">
                {{ user.name }}
              </a>
            }
          </div>

          <app-product-info [product]="product"/>

          <div class="d-flex flex-column flex-md-row gap-2 gap-md-4 mt-4">
            @if (isOwner) {
              <ion-button class="product-btn wishlist-btn" [routerLink]="['/upload-product']"
                          [queryParams]="{ edit: product.id }">
                Editar
              </ion-button>
              <ion-button class="product-btn buy-btn" (click)="deleteProduct()">
                Eliminar
              </ion-button>
            } @else {
              <ion-button class="product-btn wishlist-btn" (click)="toggleWishlist()"
                          [class.active]="isInWishlist">
                {{ isInWishlist ? ui?.wishlistButtonActive : ui?.wishlistButton }}
              </ion-button>
              <ion-button class="product-btn buy-btn" [routerLink]="['/payment', product.id]">
                {{ ui?.buyButton }}
              </ion-button>
            }
          </div>

        </div>
      </div>

      @if (relatedProducts.length > 0) {
        <h1 class="h4 fw-bold mt-4 mb-3">{{ ui?.relatedTitle }}</h1>
        <app-photo-row [products]="relatedProducts"/>
      }

    </div>
  }
</app-page-layout>
