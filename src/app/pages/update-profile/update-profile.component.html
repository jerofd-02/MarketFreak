<div class="form_container">
  <form class="form_group" [formGroup]="form" (ngSubmit)="onSubmit()">
    <label for="avatar"> {{ fields['avatar']?.label }}</label>
    <div class="add-photo" id="file_charge" (click)="avatarInput.click()">
      @if (avatarPreview) {
        <div class="avatar-preview">
          <img [src]="avatarPreview" alt="Vista previa">
        </div>
      } @else {
        <i [class]="fields['avatar']?.icon"></i>
        <p>{{ fields['avatar']?.placeholder }}</p>
      }
      @if (avatarFileName) {
        <p>{{ avatarFileName }}</p>
      }
      <input #avatarInput id="avatar" type="file" accept="image/*" hidden (change)="onAvatarChange($event)">
    </div>
    <div class="element">
      <label for="username">{{ fields['username']?.label }}</label>
      <input id="username" type="text" formControlName="username" [placeholder]="fields['username']?.placeholder"
             required>
    </div>
    <div class="element">
      <label for="location">{{ fields['location']?.label }}</label>
      <input id="location" type="text" formControlName="location" [placeholder]="fields['location']?.placeholder"
             required>
    </div>
    <div class="element">
      <label for="province">{{ fields['province']?.label }}</label>
      <select id="province" formControlName="province" required>
        @for (opt of fields['province']?.options; track opt.value) {
          <option value="opt.value">{{ opt.label }}</option>
        }
      </select>
    </div>
    <div class="element">
      <label for="description">{{ fields['description']?.label }}</label>
      <textarea id="description" [placeholder]="fields['description']?.placeholder"></textarea>
    </div>
    <button type="submit" class="button">{{ submitLabel }}</button>
  </form>
</div>
